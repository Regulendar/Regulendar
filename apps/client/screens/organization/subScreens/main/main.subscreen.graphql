query getMyScheduledEvents($input: GetEventsInputDto!) {
  getEvents(input: $input) {
    events {
      eventId
      eventTitle
      eventDateDay
      eventStartAt
      eventDuration
      eventStatus
      eventParticipations {
        userId
      }
    }
  }
}

query getEventsByMonth($input: GetEventsInputDto!) {
  getEvents(input: $input) {
    events {
      eventId
      eventParticipations {
        userId
      }
    }
  }
}
